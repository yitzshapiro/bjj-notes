services:
  bjj-notes:
    build:
      context: .
    image: bjj-notes:latest
    container_name: bjj-notes
    restart: unless-stopped
    # Real secrets live only in .env on the VPS; nothing is baked into the image.
    env_file: .env
    environment:
      NODE_ENV: production
    # No published ports: Caddy reaches this over the shared Docker network,
    # so the app is never exposed directly to the internet.
    expose:
      - "3000"
    networks:
      - caddy

networks:
  caddy:
    external: true
    # Shared, project-independent network created by hand. Caddy joins it from
    # /opt/caddy, so neither stack can remove the other's networking.
    name: caddy_net
